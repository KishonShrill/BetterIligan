<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none" role="img" aria-label="Earthquake">
  <defs>
    <linearGradient id="eqSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="140" fill="url(#eqSky)"/>
  <!-- shake lines -->
  <g stroke="#fffbeb" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M40 40 q 8 -12 16 0 q 8 12 16 0"/>
    <path d="M330 34 q 8 -12 16 0 q 8 12 16 0"/>
  </g>
  <!-- buildings, slightly tilted -->
  <g fill="#7c2d12">
    <rect x="120" y="52" width="40" height="56"/>
    <rect x="176" y="40" width="46" height="68" transform="rotate(3 199 74)"/>
    <rect x="238" y="58" width="38" height="50"/>
  </g>
  <g fill="#fcd34d" opacity="0.85">
    <rect x="130" y="62" width="8" height="8"/><rect x="146" y="62" width="8" height="8"/>
    <rect x="130" y="80" width="8" height="8"/><rect x="146" y="80" width="8" height="8"/>
    <rect x="186" y="52" width="8" height="8"/><rect x="204" y="52" width="8" height="8"/>
    <rect x="248" y="70" width="8" height="8"/><rect x="262" y="70" width="8" height="8"/>
  </g>
  <!-- ground with crack -->
  <rect x="0" y="108" width="400" height="32" fill="#78350f"/>
  <path d="M0 108 L150 108 L165 124 L150 140 M180 108 L200 122 L188 140" stroke="#fde68a" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <path d="M200 122 L230 110 L300 110 L318 126 L300 140" stroke="#fde68a" stroke-width="3" fill="none" stroke-linejoin="round"/>
</svg>
