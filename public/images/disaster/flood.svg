  <path d="M0 92 C 60 82 120 100 200 92 C 280 84 340 100 400 92 L400 140 L0 140 Z" fill="#0891b2" opacity="0.85"/>
  <path d="M0 104 C 70 96 140 112 220 104 C 300 96 360 110 400 104 L400 140 L0 140 Z" fill="#22d3ee" opacity="0.6"/>
  <path d="M0 118 C 80 110 150 124 240 118 C 320 112 370 122 400 118 L400 140 L0 140 Z" fill="#a5f3fc" opacity="0.45"/>
