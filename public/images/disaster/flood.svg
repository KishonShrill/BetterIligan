  </defs>
  <rect width="400" height="140" fill="url(#fldSky)"/>
  <!-- rain -->
  <g stroke="#cffafe" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="60" y1="16" x2="52" y2="36"/>
    <line x1="120" y1="10" x2="112" y2="30"/>
    <line x1="200" y1="16" x2="192" y2="36"/>
    <line x1="300" y1="12" x2="292" y2="32"/>
